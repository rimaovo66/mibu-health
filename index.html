<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周针记 · 替尔泊肽追踪</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="周针记">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface2:#F3F6F5; --ink:#1E2A33; --muted:#66727C; --line:#DCE2E0;
  --drug:#4338CA; --drugSoft:rgba(67,56,202,.13); --peak:rgba(67,56,202,.09);
  --protein:#C2416C; --fiber:#3F8F4E; --water:#1F8BB5; --kcal:#B7791F; --warn:#B4442E; --goal:#7C3AED;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Bricolage Grotesque",-apple-system,"PingFang SC",sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171C; --surface:#1B2229; --surface2:#242D36; --ink:#E7ECEF; --muted:#94A1AB; --line:#2E3842;
    --drug:#8B87F5; --drugSoft:rgba(139,135,245,.18); --peak:rgba(139,135,245,.12);
    --protein:#EC7A9E; --fiber:#6CC27C; --water:#5BC0E6; --kcal:#E5AA4F; --warn:#F07C64; --goal:#B79CFA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1B2229; --surface2:#242D36; --ink:#E7ECEF; --muted:#94A1AB; --line:#2E3842;
  --drug:#8B87F5; --drugSoft:rgba(139,135,245,.18); --peak:rgba(139,135,245,.12);
  --protein:#EC7A9E; --fiber:#6CC27C; --water:#5BC0E6; --kcal:#E5AA4F; --warn:#F07C64; --goal:#B79CFA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:14px 16px 140px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px}
h2{font-size:17px;margin-bottom:10px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--drug);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.streak{background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-family:var(--num)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:10px;background:var(--surface2);font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg.mini button{padding:4px 10px;font-size:12px}

/* hero */
.hero{padding:18px 16px 10px;background:var(--surface);border-radius:22px;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--num);font-size:44px;line-height:1;font-weight:700;color:var(--drug)}
.big small{font-size:18px;font-weight:500;margin-left:3px}
.phase-tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--drugSoft);color:var(--drug);font-size:13px;font-weight:600}
.chart-wrap{margin:10px -6px 0}
.chart-wrap svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.countdown{font-family:var(--num);font-weight:700;font-size:20px}
.track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.track > div{height:100%;border-radius:99px;background:var(--fiber)}

/* bars & widgets */
.bar{margin:12px 0}
.bar-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar-track{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s}
.bar.focus .bar-head b::after{content:"本阶段重点";font-size:11px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tip{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px}
.macro{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.macro b{color:var(--ink);font-family:var(--num)}
.w2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--surface);border-radius:18px;padding:14px}
.card h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.card .v{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.2}
.card .v small{font-size:13px;color:var(--muted);font-weight:500}
.pm{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.pm button{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:20px;line-height:1}
.focus-tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--drugSoft);color:var(--drug)}
.eq{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1fr;align-items:center;text-align:center;margin-top:8px}
.eq b{font-family:var(--num);font-size:21px;display:block;line-height:1.2}
.eq small{color:var(--muted);font-size:12px}
.eq i{font-style:normal;color:var(--muted)}

/* lists */
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.item:first-child{border-top:0}
.x{color:var(--muted);font-size:20px;padding:0 4px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.meal-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 2px}
.meal-add{border:1.5px dashed var(--line);border-radius:12px;padding:9px;text-align:center;width:100%;color:var(--muted);font-size:14px;margin-top:6px}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.add{background:var(--surface2);border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:600}
.add span{display:block;font-size:22px;margin-bottom:2px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.quick button{background:var(--surface2);border-radius:14px;padding:14px 4px;font-size:13px;font-weight:600}
.quick span{display:block;font-size:24px;line-height:1.3}
.check{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check:first-of-type{border-top:0}
.check .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.check.done .dot{background:var(--fiber);border-color:var(--fiber);color:#fff}
.check.done b{text-decoration:line-through;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;padding:14px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--num);font-size:24px;font-weight:700}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:3/4;background:var(--surface2);border-radius:10px;overflow:hidden;position:relative;display:block;width:100%;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.meas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meas div{background:var(--surface2);border-radius:12px;padding:10px}
.meas b{font-family:var(--num);font-size:18px;display:block}
.meas small{font-size:12px;color:var(--muted)}

/* body map */
.body-map{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.body-map svg{width:100%;height:auto}
.site-dot{cursor:pointer}
.chip{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--surface2);font-size:13px;margin:3px 4px 3px 0}
.chip.on{background:var(--drug);color:#fff}
@keyframes pulse{0%{r:7;opacity:.6}100%{r:15;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button span{font-size:19px;line-height:1.25;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on span{filter:none;opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--drug);color:#fff;font-size:30px;line-height:1;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none;max-width:560px;margin:0 auto}
.open .scrim,.open .sheet{display:block}
.sheet h3{font-size:18px;margin-bottom:8px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 0}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--drug);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.edit-row{display:grid;grid-template-columns:1fr 78px 28px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.edit-row .meta{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sx{display:grid;grid-template-columns:96px repeat(4,1fr);gap:6px;align-items:center;margin:6px 0}
.sx button{padding:7px 0;border-radius:9px;background:var(--surface2);font-size:12px}
.sx button.on{background:var(--warn);color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.warn{color:var(--warn)}
.hidden{display:none!important}
details summary{cursor:pointer}
</style>
</head>
<body>
<main id="app"><div class="loading"><div class="spin"></div>正在载入你的记录…</div></main>
<button class="fab" id="fab" aria-label="快速记录">+</button>
<nav class="tabs"><div class="in">
  <button data-tab="home" class="on"><span>🏠</span>首页</button>
  <button data-tab="meds"><span>💉</span>剂量</button>
  <button data-tab="food"><span>🍱</span>饮食</button>

  <button data-tab="me"><span>👤</span>我的</button>
</div></nav>
<div id="sheetRoot"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast"></div>
<div id="qr-tmp" style="display:none"></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="barcodeIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="labelIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="progIn" accept="image/*" class="hidden">
<input type="file" id="importIn" accept="application/json,.json" class="hidden">
<input type="file" id="extIn" accept="image/*" class="hidden">
<input type="file" id="ciLabelIn" accept="image/*" capture="environment" class="hidden">

<script>
/* ================= constants ================= */
const DOSES=[2.5,5,7.5,10,12.5,15];
const SITES=[
  {id:"abd_ru",name:"腹部右上",x:88,y:96,reg:"腹部"},{id:"abd_lu",name:"腹部左上",x:112,y:96,reg:"腹部"},
  {id:"abd_rl",name:"腹部右下",x:88,y:122,reg:"腹部"},{id:"abd_ll",name:"腹部左下",x:112,y:122,reg:"腹部"},
  {id:"thigh_r",name:"右大腿",x:84,y:182,reg:"大腿"},{id:"thigh_l",name:"左大腿",x:116,y:182,reg:"大腿"},
  {id:"arm_r",name:"右上臂",x:57,y:82,reg:"上臂"},{id:"arm_l",name:"左上臂",x:143,y:82,reg:"上臂"}
];
const SX=[["nausea","恶心"],["vomit","呕吐"],["diarrhea","腹泻"],["constip","便秘"],["bloat","胀气"],["reflux","反酸烧心"],["fatigue","乏力"],["headache","头痛"],["dizzy","头晕"],["site","注射处红肿"]];
const SXN=Object.fromEntries(SX);
const MEALS=[["breakfast","早餐"],["lunch","午餐"],["snack","零食"],["dinner","晚餐"]];
const ACTS=[[1.2,"久坐为主"],[1.375,"轻度活动"],[1.55,"中度活动"],[1.725,"高强度"]];
const RATES=[0.25,0.5,0.75,1,1.2];
const EXT=[["步行",3.5],["快走",4.5],["跑步",8],["骑车",6],["力量训练",5],["游泳",6],["瑜伽拉伸",2.5],["其他",4]];
const MEAS=[["chest","胸围"],["waist","腰围"],["hips","臀围"],["arm","上臂围"],["thigh","大腿围"],["neck","颈围"]];
const WEEK=["日","一","二","三","四","五","六"];
const KE=Math.LN2/120, KA=0.12, F=0.8;   // t½≈5d, Tmax≈1–2d, F≈80%
const DAY=864e5;

/* ================= state ================= */
const S={tab:"home",settings:null,injections:[],weights:[],products:{},recents:[],measures:[],symptoms:[],photos:[],activity:[],combos:[],days:{},photoCache:{},
  foodDate:null,sample:null,imgOK:false,downloads:null,medRange:30,wRange:0,after:[]};
const DEF={sex:null,age:null,heightCm:null,goalKg:null,rateKg:0.5,activity:1.375,startKg:null,startTs:null,med:"Mounjaro",
  injWeekday:null,injTime:"20:00",proteinPerKg:1.2,fiberG:25,waterMl:2000,stepsGoal:6000,exMinGoal:20,kcalAuto:true,kcalGoal:null,onboarded:false,checklistHidden:false};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round((+n||0)*10)/10, r0=n=>Math.round(+n||0);
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const md=d=>{const x=new Date(d);return (x.getMonth()+1)+"/"+x.getDate()};
const ymd=d=>{const x=new Date(d);return x.getFullYear()+"年"+(x.getMonth()+1)+"月"+x.getDate()+"日"};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>dkey(Date.now());
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}
function localDT(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function defaultMeal(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"breakfast":h<14.5?"lunch":h<17?"snack":h<21.5?"dinner":"snack"}

/* ================= storage ================= */
const store={
  mode:"local",db:null,timers:{},pending:{},
  async init(){
    try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("zhouzhenji",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    loadAI();
  },
  tx(mode){return this.db.transaction("kv",mode).objectStore("kv")},
  async get(k){
    if(this.db){try{const v=await new Promise((res,rej)=>{const r=this.tx("readonly").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v!==undefined&&v!==null)return JSON.parse(JSON.stringify(v))}catch(e){}}
    try{const v=localStorage.getItem("tz:"+k);return v?JSON.parse(v):null}catch(e){return null}
  },
  put(k,v){return new Promise((res,rej)=>{if(!this.db)return rej();try{const r=this.tx("readwrite").put(JSON.parse(JSON.stringify(v)),k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  write(k){const v=this.pending[k];delete this.pending[k];clearTimeout(this.timers[k]);if(v===undefined)return Promise.resolve();
    return this.put(k,v).catch(()=>{try{localStorage.setItem("tz:"+k,JSON.stringify(v))}catch(e){toast("保存失败，手机存储空间可能不足")}})},
  set(k,v,now){this.pending[k]=v;clearTimeout(this.timers[k]);if(now)return this.write(k);this.timers[k]=setTimeout(()=>this.write(k),250);return Promise.resolve()},
  flush(){Object.keys(this.pending).forEach(k=>this.write(k))},
  del(k){delete this.pending[k];try{localStorage.removeItem("tz:"+k)}catch(e){}if(this.db)try{this.tx("readwrite").delete(k)}catch(e){}},
  async keys(){if(!this.db)return [];return new Promise(res=>{const r=this.tx("readonly").getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")store.flush()});
window.addEventListener("pagehide",()=>store.flush());

/* ---- AI (optional: the user's own Anthropic API key, stored only on this device) ---- */
function loadAI(){let c={};try{c=JSON.parse(localStorage.getItem("tz:ai")||"{}")}catch(e){}
  S.aiCfg={key:c.key||"",model:c.model||"claude-haiku-5-5"};S.sample=S.aiCfg.key?makeAI(S.aiCfg.key,S.aiCfg.model):null;S.imgOK=!!S.sample}
function makeAI(key,model){return {json:async(prompt,opts={})=>{
  const content=[];
  for(const f of (opts.images||[])){const d=await compress(f,1100,600000);content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:d.split(",")[1]}})}

function curWeight(){const w=S.weights.slice().sort((a,b)=>b.ts-a.ts)[0];return w?w.kg:null}
function startWeight(){const w=S.weights.slice().sort((a,b)=>a.ts-b.ts)[0];return w?w.kg:(S.settings.startKg||null)}
function minGoal(h){return h?Math.ceil(18.5*(h/100)**2*10)/10:null}
function planFor(p){
  const out={};
  if(p.h&&p.w&&p.goal&&p.rate){
    const weeks=Math.max(0,(p.w-p.goal)/p.rate);
    out.weeks=weeks;out.date=Date.now()+weeks*7*DAY;
  }
  if(p.sex&&p.age&&p.h&&p.w){
    const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==="M"?5:-161);
    const tdee=bmr*(p.act||1.375);
    const floor=p.sex==="M"?1500:1200;
    const raw=tdee-(p.goal&&p.goal<p.w?p.rate*7700/7:0);
    out.tdee=Math.round(tdee);out.kcal=Math.max(floor,Math.round(raw/10)*10);out.floorHit=raw<floor;
  }
  return out;
}
function targets(){
  const s=S.settings,w=curWeight();
  const pl=planFor({sex:s.sex,age:s.age,h:s.heightCm,w,goal:s.goalKg,rate:s.rateKg,act:s.activity});
  const kcal=s.kcalAuto?(pl.kcal||null):(s.kcalGoal||null);
  const protein=w?Math.round(w*s.proteinPerKg):null;
  const fat=kcal?Math.round(kcal*0.28/9):null;
  const carbs=kcal&&protein?Math.max(0,Math.round((kcal-protein*4-fat*9)/4)):null;
  return {kcal,protein,fat,carbs,fiber:s.fiberG,water:s.waterMl,steps:s.stepsGoal,exMin:s.exMinGoal};
}
function totals(day){
  const t={kcal:0,p:0,c:0,f:0,fib:0};
  for(const x of day.foods){t.kcal+=+x.kcal||0;t.p+=+x.p||0;t.c+=+x.c||0;t.f+=+x.f||0;t.fib+=+x.fib||0}
  t.p+=day.quickP||0;t.kcal+=(day.quickP||0)*4;
  t.ex=(day.exercise||[]).reduce((a,e)=>a+(+e.kcal||0),0);
  t.exMin=(day.exercise||[]).reduce((a,e)=>a+(+e.min||0),0);
  return t;
}

function sortedInj(){return S.injections.slice().sort((a,b)=>a.ts-b.ts)}
function lastInj(){const a=sortedInj();return a[a.length-1]||null}
function nextInj(){
  const s=S.settings,last=lastInj(),now=Date.now();
  if(s.injWeekday!==null&&s.injWeekday!==undefined&&s.injWeekday!==""){
    const [hh,mm]=(s.injTime||"20:00").split(":").map(Number);
    const d=new Date();d.setHours(hh||0,mm||0,0,0);
    d.setDate(d.getDate()+((+s.injWeekday-d.getDay()+7)%7));
    // already injected around this slot → move a week on
    if(d.getTime()<=now||(last&&Math.abs(last.ts-d.getTime())<3*DAY))d.setDate(d.getDate()+7);
    if(last&&Math.abs(last.ts-d.getTime())<3*DAY)d.setDate(d.getDate()+7);
    const ts=d.getTime(),prev=ts-7*DAY;
    const overdue=!!(last&&now>prev+DAY&&last.ts<prev-3*DAY);
    return {ts:overdue?prev:ts,prev:overdue?prev-7*DAY:prev,overdue};
  }
  if(last){const ts=last.ts+7*DAY;return {ts,prev:last.ts,overdue:now>ts+DAY}}
  return null;
}
function injWithProjection(until){
  const list=sortedInj().map(i=>({...i}));const last=list[list.length-1];
  if(last){const n=nextInj();let t=n&&!n.overdue?n.ts:last.ts+7*DAY;while(t<until){list.push({ts:t,dose:last.dose,proj:true});t+=7*DAY}}
  return list;
}
function amountAt(ms,list){
  let a=0;
  for(const i of list){const dt=(ms-i.ts)/3.6e6;if(dt<=0)continue;a+=i.dose*F*KA/(KA-KE)*(Math.exp(-KE*dt)-Math.exp(-KA*dt))}
  return a;
}
function phaseInfo(){
  const inj=sortedInj();if(!inj.length)return null;
  const now=Date.now(),last=inj[inj.length-1],list=injWithProjection(now+8*DAY);
  const dayN=Math.floor((now-last.ts)/DAY)+1;
  let mx=0;const tr=amountAt(last.ts,list);
  for(let t=last.ts;t<=last.ts+7*DAY;t+=3*36e5)mx=Math.max(mx,amountAt(t,list));
  const cur=amountAt(now,list);
  const inPeak=dayN<=7&&cur>=tr+0.72*(mx-tr);
  let i=inj.length-1;while(i>0&&inj[i-1].dose===last.dose)i--;
  const escal=i>0&&inj[i-1].dose<last.dose&&now-inj[i].ts<14*DAY;
  return {dayN,inPeak,escal,last,cur,next:nextInj()};
}

  return m;
}

  if(ph&&ph.inPeak)return {order:["protein","water","fiber"],key:"peak"};
  return {order:["protein","fiber","water"],key:ph?"normal":"none"};
}

function pkChart(rangeDays,futureDays){
  const inj=sortedInj();
  if(!inj.length)return `<div class="empty">记录第一针后，这里会画出体内药量估算曲线，并标出控食高峰期。</div>`;
  const now=Date.now();
  const start=rangeDays?Math.max(now-rangeDays*DAY,inj[0].ts-DAY):inj[0].ts-DAY;
  const end=now+futureDays*DAY,list=injWithProjection(end);
  const span=(end-start)/DAY,stepH=span>70?12:span>30?6:3;
  const W=360,H=170,pl=30,pr=8,pt=14,pb=26;
  const pts=[];let mx=0;
  for(let t=start;t<=end;t+=stepH*36e5){const a=amountAt(t,list);pts.push([t,a]);mx=Math.max(mx,a)}
  mx=Math.max(mx*1.15,1);
  const X=t=>pl+(t-start)/(end-start)*(W-pl-pr),Y=a=>pt+(1-a/mx)*(H-pt-pb);
  let shade="";
  if(span<=60)list.forEach((c,i)=>{
    const cEnd=list[i+1]?list[i+1].ts:c.ts+7*DAY;const seg=pts.filter(p=>p[0]>=c.ts&&p[0]<cEnd);
    let cm=0;seg.forEach(p=>cm=Math.max(cm,p[1]));const th=amountAt(c.ts,list)+0.72*(cm-amountAt(c.ts,list));let s=null;
    seg.forEach((p,j)=>{if(p[1]>=th&&s===null)s=p[0];if((p[1]<th||j===seg.length-1)&&s!==null){if(p[0]>start&&s<end)shade+=`<rect x="${X(Math.max(s,start))}" y="${pt}" width="${Math.max(0,X(Math.min(p[0],end))-X(Math.max(s,start)))}" height="${H-pt-pb}" fill="var(--peak)"/>`;s=null}});
  });
  const past=pts.filter(p=>p[0]<=now),fut=pts.filter(p=>p[0]>=now);
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  const area=past.length>1?path(past)+`L${X(past[past.length-1][0])} ${Y(0)}L${X(past[0][0])} ${Y(0)}Z`:"";
  const tickEvery=span<=16?2:span<=40?7:span<=120?14:30;
  let ticks="";const d0=new Date(start);d0.setHours(0,0,0,0);let n=0;
  for(let t=d0.getTime()+DAY;t<end;t+=DAY){if(n++%tickEvery)continue;ticks+=`<text x="${X(t)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${md(t)}</text>`}
  let yt="";[0,0.5,1].forEach(f=>{const v=mx/1.15*f;yt+=`<text x="${pl-5}" y="${Y(v)+3}" font-size="10" fill="var(--muted)" text-anchor="end">${r1(v)}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${f?'stroke-dasharray="2 3"':""}/>`});
  const marks=span<=120?list.filter(c=>c.ts>=start&&c.ts<=end).map(c=>`<circle cx="${X(c.ts)}" cy="${Y(0)}" r="3.5" fill="${c.proj?"var(--surface)":"var(--drug)"}" stroke="var(--drug)" stroke-width="1.5"/>`).join(""):"";
  const nowA=amountAt(now,list);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体内药量估算曲线">${shade}${yt}${ticks}
    <path d="${area}" fill="var(--drugSoft)"/><path d="${path(past)}" fill="none" stroke="var(--drug)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="${path(fut)}" fill="none" stroke="var(--drug)" stroke-width="2" stroke-dasharray="4 4" opacity=".75"/>
    <line x1="${X(now)}" x2="${X(now)}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)"/>
    <circle cx="${X(now)}" cy="${Y(nowA)}" r="5" fill="var(--drug)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(now)}" y="${pt-3}" font-size="10" fill="var(--ink)" text-anchor="middle">今天</text>${marks}</svg>`;
}

function siteStats(){
  const now=Date.now(),map={};SITES.forEach(s=>map[s.id]={last:null});
  S.injections.forEach(i=>{if(map[i.site]&&(!map[i.site].last||i.ts>map[i.site].last))map[i.site].last=i.ts});
  const li=lastInj();let best=null,bs=-1e9;
  SITES.forEach(s=>{if(li&&s.id===li.site)return;let sc=map[s.id].last?(now-map[s.id].last)/DAY:999;
    if(li){const ls=SITES.find(x=>x.id===li.site);if(ls&&ls.reg===s.reg)sc-=0.5}if(sc>bs){bs=sc;best=s.id}});
  return {map,best};
}
function bodySVG(sel,clickable){

  const dots=SITES.map(s=>{const d=map[s.id].last?(now-map[s.id].last)/DAY:null,recent=d!==null&&d<14;
    const fill=s.id===sel?"var(--drug)":recent?"var(--warn)":"var(--surface)";

async function loadPhotos(ids){
  for(const id of ids){
    if(!S.photoCache[id]){const d=await store.get("photo-"+id);if(d&&d.data)S.photoCache[id]=d.data}

  }
}

/* ---- photos ---- */
function compress(file,max0,limit){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let max=max0||760,q=.78,out;const draw=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)};
    out=draw();while(out.length>(limit||200000)&&max>320){max-=110;q=Math.max(.5,q-.06);out=draw()}URL.revokeObjectURL(u);res(out)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
async function addProgressPhoto(file){
  openSheet(`<div class="loading"><div class="spin"></div>正在保存照片…</div>`);
  try{const data=await compress(file);const id=uid();await store.set("photo-"+id,{data,ts:Date.now()},true);S.photoCache[id]=data;
    S.photos.push({id,ts:Date.now(),kg:curWeight()});save.photos();closeSheet();toast("照片已保存");S.tab="progress";render()}
  catch(e){openSheet(`<h3>没能保存</h3><div class="small">这张图片处理失败，换一张试试。</div><button class="btn" data-act="close" style="margin-top:12px">好的</button>`)}
}

   <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="close" style="flex:1">关闭</button><button class="btn ghost" id="phDel" style="flex:1;color:var(--warn)">删除</button></div>`);
  await loadPhotos([id]);const img=$("#bigPh");if(img&&S.photoCache[id])img.src=S.photoCache[id];
  $("#phDel").onclick=()=>{if(!confirm("删除这张照片？"))return;S.photos=S.photos.filter(x=>x.id!==id);store.del("photo-"+id);delete S.photoCache[id];save.photos();closeSheet();render()};

  openSheet(`<h3>记录饮食</h3>${mealPicker()}<div class="adds">
   <button class="add" data-act="photo"><span>📷</span>拍照识别</button><button class="add" data-act="barcode"><span>🏷️</span>扫条形码</button>
   <button class="add" data-act="search"><span>🔍</span>搜索描述</button><button class="add" data-act="paste"><span>📋</span>粘贴识别</button><button class="add" data-act="manual"><span>✏️</span>手动输入</button></div>
   <div class="row between" style="margin-top:16px"><b>固定餐</b><button class="btn ghost small" data-act="newCombo">新建</button></div>
   ${S.combos.length?S.combos.map(c=>{const t=comboTot(c);return `<div class="item"><button data-act="useCombo" data-id="${c.id}" style="text-align:left;flex:1"><b>${esc(c.name)}</b><div class="small muted num">${r0(t.kcal)} kcal，蛋白 ${r1(t.p)} g，${c.items.length} 项</div></button><button class="btn small" data-act="useCombo" data-id="${c.id}">添加</button></div>`}).join(""):`<div class="empty">把常吃的组合存起来，比如“代餐奶昔”，以后一点就加。</div>`}`);
}
function comboTot(c){return c.items.reduce((a,x)=>({kcal:a.kcal+(+x.kcal||0),p:a.p+(+x.p||0)}),{kcal:0,p:0})}
const blankItem=()=>({name:"",g:0,kcal:0,p:0,c:0,f:0,fib:0});
function comboSheet(id,prefill){

function addFoods(items){
  const k=S.foodDate||today(),day=S.days[k],meal=S._meal||defaultMeal();
  items.forEach(it=>{
    day.foods.push({id:uid(),meal,name:it.name,g:r0(it.g),kcal:r0(it.kcal),p:r1(it.p),c:r1(it.c),f:r1(it.f),fib:r1(it.fib),t:Date.now()});
    if(it.g>0){const per={name:it.name,kcal:it.kcal/it.g*100,p:it.p/it.g*100,c:it.c/it.g*100,f:it.f/it.g*100,fib:it.fib/it.g*100,lastG:it.g};
      S.recents=[per,...S.recents.filter(r=>r.name!==it.name)].slice(0,80)}
  });
  saveDay(k);save.recents();closeSheet();toast("已添加到"+(MEALS.find(m=>m[0]===meal)||[0,""])[1]);render();
}

function gramsSheet(per,title){

/* ---- Open Food Facts ---- */
const OFF="https://world.openfoodfacts.org",OFF_FIELDS="code,product_name,product_name_zh,product_name_en,brands,nutriments,serving_quantity";
function offParse(p){
  const n=p.nutriments||{};let kcal=n["energy-kcal_100g"];
  if(kcal==null&&n["energy-kj_100g"]!=null)kcal=n["energy-kj_100g"]/4.184;
  if(kcal==null&&n["energy_100g"]!=null)kcal=n["energy_100g"]/4.184;
  if(kcal==null||isNaN(+kcal))return null;
  const brand=(p.brands||"").split(",")[0].trim(),pn=(p.product_name_zh||p.product_name||p.product_name_en||"").trim();
  const name=(pn.toLowerCase().includes(brand.toLowerCase())?pn:[brand,pn].filter(Boolean).join(" "))||"未命名商品";
  return {name:name.slice(0,50),kcal:+kcal||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,fib:+n.fiber_100g||0,lastG:+p.serving_quantity||100,code:p.code};
}
async function offSearch(q){
  const r=await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`);
  if(!r.ok)throw new Error("off");const j=await r.json();return (j.products||[]).map(offParse).filter(Boolean);
}
async function offCode(code){
  const r=await fetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if(!r.ok)return null;const j=await r.json();return j.status===1&&j.product?offParse({...j.product,code}):null;
}
async function onlineSearch(q){
  loadingSheet("正在 Open Food Facts 搜索…");
  let res;try{res=await offSearch(q)}catch(e){if(isOpen())openSheet(`<h3>搜索失败</h3><div class="small">网络连接失败，或者搜索太频繁（每分钟最多约 10 次），稍后再试。</div><button class="btn" data-act="close" style="margin-top:12px">好的</button>`);return}
  if(!isOpen())return;S._off=res;
  openSheet(`<h3>“${esc(q)}”的在线结果</h3><div class="small muted">来自 Open Food Facts，数据由网友上传，选之前看一下热量是否合理。</div>
   ${res.length?res.map((p,i)=>`<div class="item" data-off="${i}" style="cursor:pointer"><span>${esc(p.name)}</span><span class="small muted num" style="text-align:right;white-space:nowrap">${r0(p.kcal)} kcal/100 g<br>蛋白 ${r1(p.p)} g</span></div>`).join(""):`<div class="empty">没有找到。试试英文名或品牌名，或者用粘贴识别、AI 估算。</div>`}
   <button class="btn ghost small" data-act="search" style="margin-top:10px">返回</button>`);
  $("#sheet").onclick=e=>{const it=e.target.closest("[data-off]");if(!it)return;const p=S._off[+it.dataset.off];if(!p)return;
    if(p.code){S.products[p.code]={name:p.name,kcal:p.kcal,p:p.p,c:p.c,f:p.f,fib:p.fib,lastG:p.lastG};save.products()}
    gramsSheet(p,"每 100 g（来自 Open Food Facts）")};
}

/* ---- smart paste ---- */
const NUM="(\\d+(?:[.,]\\d+)?)";
const toN=s=>parseFloat(String(s).replace(",","."));
function parseFoodBlock(b){
  const grab=re=>{const m=b.match(re);return m?toN(m[1]):null};
  let kcal=grab(new RegExp("(?:热量|能量|卡路里|energy|calories?)[^\\d\\n]{0,14}"+NUM+"\\s*(?:kcal|千卡|大卡|卡)","i"));
  if(kcal==null){const kj=grab(new RegExp("(?:热量|能量|energy)[^\\d\\n]{0,14}"+NUM+"\\s*(?:kj|千焦)","i"));if(kj!=null)kcal=kj/4.184}
  if(kcal==null)kcal=grab(new RegExp(NUM+"\\s*(?:kcal|千卡|大卡)","i"));
  if(kcal==null){const kj=grab(new RegExp(NUM+"\\s*(?:kj|千焦)","i"));if(kj!=null)kcal=kj/4.184}
  if(kcal==null)return null;
  const firstNot=(re,bad)=>{re.lastIndex=0;let m;while((m=re.exec(b))){if(!m[1]||!bad.test(m[1]))return toN(m[2])}return null};
  const p=grab(new RegExp("蛋白质?[^\\d\\n]{0,10}"+NUM))??grab(new RegExp("protein[^\\d\\n]{0,10}"+NUM,"i"));
  const c=grab(new RegExp("碳水(?:化合物)?[^\\d\\n]{0,10}"+NUM))??grab(new RegExp("carb(?:ohydrate)?s?[^\\d\\n]{0,10}"+NUM,"i"));
  let f=firstNot(new RegExp("(饱和|反式)?脂肪[^\\d\\n]{0,10}"+NUM,"g"),/饱和|反式/);
  if(f==null)f=firstNot(new RegExp("(saturated |trans )?fat[^\\d\\n]{0,10}"+NUM,"gi"),/saturated|trans/i);
  const fib=grab(new RegExp("纤维[^\\d\\n]{0,10}"+NUM))??grab(new RegExp("fib(?:er|re)[^\\d\\n]{0,10}"+NUM,"i"));
  const per100=/(?:每|per|\/)\s*100\s*(?:g|克|ml|毫升|mL)/i.test(b);
  const servG=grab(new RegExp("(?:常用份量|每份|每勺|一份|一勺|1\\s*勺|份量|serving size|per serving)[^\\d\\n]{0,10}"+NUM+"\\s*(?:g|克|ml|毫升)","i"));
  let name=null;const nm=b.match(/(?:食物|名称|产品|品名|food|name)\s*[:：]\s*([^\n]+)/i);
  if(nm)name=nm[1];
  else{const line=b.split("\n").map(l=>l.trim()).find(l=>l&&!/^(?:热量|能量|蛋白|碳水|脂肪|纤维|膳食|基准|营养|份量|常用|energy|protein|carb|fat|fib)/i.test(l.replace(/^[\-*•\d.、)\s#]+/,"")));
    if(line)name=line.split(/[:：|，,(（]|热量|能量|每\s*100|per 100/i)[0]}
  name=String(name||"").replace(/[*#>`_]/g,"").replace(/^[\-•\s]*\d+[.、)]\s*/,"").replace(/^[\-•\s]+/,"").trim().slice(0,40)||"食物";
  const vals={kcal,p:p||0,c:c||0,f:f||0,fib:fib||0};let per,g,note="";
  if(per100){per=vals;g=servG||100}
  else if(servG){per=Object.fromEntries(Object.entries(vals).map(([k,v])=>[k,v*100/servG]));g=servG}
  else{per=vals;g=100;note="没看到“每100g”或份量，按每 100 g 处理了，请确认。"}
  return {name,per,g,note};
}
function parsePaste(text){
  const t=String(text||"").replace(/\r/g,"");
  const out={foods:[],weight:null,steps:null};
  const wm=t.match(/体重\s*[:：]?\s*(\d{2,3}(?:\.\d+)?)/);if(wm)out.weight=toN(wm[1]);
  const sm=t.match(/步数\s*[:：]?\s*(\d{2,6})/);if(sm)out.steps=+sm[1];
  let blocks=t.split(/\n\s*\n|\n(?=\s*(?:食物|名称|产品)\s*[:：])|\n(?=\s*(?:\d+[.、)]|[-•])\s*\S)/).map(x=>x.trim()).filter(Boolean);
  // merge blocks that have no energy into the next one (e.g. a heading line)
  const merged=[];let carry="";
  for(const b of blocks){const s=carry?carry+"\n"+b:b;if(parseFoodBlock(s)){merged.push(s);carry=""}else carry=s}
  for(const b of merged){const f=parseFoodBlock(b);if(f)out.foods.push(f)}
  if(!out.foods.length){const f=parseFoodBlock(t);if(f)out.foods.push(f)}
  return out;
}
async function applyBody(r,close){
  const k=today();
  if(r.weight&&r.weight>20&&r.weight<400){S.weights=S.weights.filter(w=>dkey(w.ts)!==k);S.weights.push({id:uid(),ts:Date.now(),kg:r1(r.weight)});save.weights()}
  if(r.steps){const d=await loadDay(k);d.steps=r.steps;saveDay(k)}
  toast([r.weight?"体重 "+r1(r.weight)+" kg":"",r.steps?"步数 "+r.steps:""].filter(Boolean).join("，")+" 已记录");
  if(close){closeSheet();render()}
}

}
function markBackup(){S.settings.lastBackup=Date.now();save.settings();render()}
async function exportData(){
  toast("正在整理数据…");store.flush();
  const keys=await store.keys(),days={};
  for(const k of keys.filter(k=>String(k).startsWith("day-")))days[String(k).slice(4)]=await store.get(k);
  const photos=[];for(const p of S.photos){const d=await store.get("photo-"+p.id);photos.push({...p,data:d&&d.data})}
  const data={app:"zhouzhenji",version:2,exportedAt:new Date().toISOString(),settings:S.settings,injections:S.injections,weights:S.weights,measures:S.measures,symptoms:S.symptoms,days,products:S.products,recents:S.recents,combos:S.combos,photos};
  const name="周针记备份-"+today()+".json",blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);markBackup();
}
async function importData(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("文件读不了");return}
  if(!d||!(d.injections||d.settings||d.days)){toast("这不是周针记的备份文件");return}
  if(!confirm("把备份里的记录合并进来？已有的记录不会重复。"))return;
  const merge=(cur,inc)=>{const ids=new Set(cur.map(x=>x.id));return cur.concat((inc||[]).filter(x=>x&&!ids.has(x.id)))};
  S.injections=merge(S.injections,d.injections);S.weights=merge(S.weights,d.weights);S.measures=merge(S.measures,d.measures);
  S.symptoms=merge(S.symptoms,d.symptoms);S.combos=merge(S.combos,d.combos);
  S.products=Object.assign({},d.products||{},S.products);
  if(d.recents){const names=new Set(S.recents.map(r=>r.name));S.recents=S.recents.concat(d.recents.filter(r=>r&&!names.has(r.name))).slice(0,120)}
  if(d.settings&&!S.settings.onboarded)S.settings=Object.assign({},DEF,d.settings,{lastBackup:S.settings.lastBackup||null});
  for(const [k,v] of Object.entries(d.days||{})){if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;const cur=await loadDay(k);
    const ids=new Set(cur.foods.map(f=>f.id));cur.foods=cur.foods.concat((v.foods||[]).filter(f=>!ids.has(f.id)));
    cur.waterMl=Math.max(cur.waterMl||0,v.waterMl||0);cur.quickP=Math.max(cur.quickP||0,v.quickP||0);cur.steps=Math.max(cur.steps||0,v.steps||0);
    const eids=new Set((cur.exercise||[]).map(e=>e.id));cur.exercise=(cur.exercise||[]).concat((v.exercise||[]).filter(e=>!eids.has(e.id)));saveDay(k)}
  let ph=0;for(const p of (d.photos||[])){if(p&&p.data&&!S.photos.some(x=>x.id===p.id)){await store.set("photo-"+p.id,{data:p.data,ts:p.ts},true);S.photos.push({id:p.id,ts:p.ts,kg:p.kg});ph++}}
  save.inj();save.weights();save.measures();save.symptoms();save.combos();save.products();save.recents();save.photos();save.settings();store.flush();
  closeSheet();toast("导入完成"+(ph?"，含 "+ph+" 张照片":""));render();
}

/* ---- AI settings ---- */
function aiSheet(){
  const c=S.aiCfg;
  openSheet(`<h3>AI 设置</h3><div class="small muted">拍照识别食物、读营养成分表、AI 估算需要你自己的 Anthropic API 密钥。密钥只保存在这台手机上，不会进备份文件，也不在 GitHub 上。</div>
   <label>API 密钥</label><input id="aiKey" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(c.key)}">
   <label>模型</label><input id="aiModel" value="${esc(c.model)}" autocapitalize="off" autocomplete="off">
   <div class="note">默认 claude-haiku-5-5，便宜够用；想识图更准可以改成 claude-sonnet-5-5。按调用量计费。</div>
   <div id="aiMsg" class="small" style="margin-top:8px"></div>
   <div class="row" style="margin-top:14px;gap:8px"><button class="btn ghost" id="aiTest" style="flex:1">测试连接</button><button class="btn" id="aiSave" style="flex:1">保存</button></div>
   ${c.key?`<button class="btn ghost small" id="aiClear" style="margin-top:10px;color:var(--warn)">清除密钥</button>`:""}`);
  const persist=()=>{const key=$("#aiKey").value.trim(),model=$("#aiModel").value.trim()||"claude-haiku-5-5";try{localStorage.setItem("tz:ai",JSON.stringify({key,model}))}catch(e){}loadAI()};
  $("#aiSave").onclick=()=>{persist();closeSheet();toast(S.sample?"AI 功能已开启":"已保存");render()};
  $("#aiTest").onclick=async()=>{persist();if(!S.sample){$("#aiMsg").textContent="请先填密钥";return}$("#aiMsg").textContent="测试中…";
    try{const r=await S.sample.json('只返回 JSON：{"ok":true}');$("#aiMsg").textContent=r&&r.ok?"✓ 连接成功":"连上了，但返回格式异常"}catch(e){$("#aiMsg").textContent=aiErr(e)}};
  if(c.key)$("#aiClear").onclick=()=>{try{localStorage.removeItem("tz:ai")}catch(e){}loadAI();closeSheet();render()};
}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  const nb=e.target.closest("nav.tabs button");
  if(nb){S.tab=nb.dataset.tab;if(S.tab==="food")S.foodDate=S.foodDate||today();return render()}
  const sg=e.target.closest("[data-seg] button");
  if(sg){const box=sg.parentElement,id=box.dataset.seg;box.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===sg));
    if(id==="medRange"){S.medRange=+sg.dataset.v;return render()}
    if(id==="wRange"){S.wRange=+sg.dataset.v;return render()}
    if(id==="meal")S._meal=sg.dataset.v;
    return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  switch(a){
    case "close":return closeSheet();
    case "logInj":return injSheet();
    case "sx":return sxSheet();
    case "logWeight":return weightSheet();
    case "measure":return measureSheet();
    case "steps":return stepsSheet();
    case "exercise":return exerciseSheet();
    case "profile":return profileSheet(false);
    case "settings":return settingsSheet();
    case "export":return exportData();
    case "progPhoto":$("#progIn").value="";return $("#progIn").click();
    case "viewPhoto":return viewPhoto(b.dataset.id);
    case "addMeal":S.foodDate=S.foodDate||today();if(S.tab!=="food"&&!b.dataset.meal){S.foodDate=today()}return addSheet(b.dataset.meal);
    case "hideChecklist":S.settings.checklistHidden=true;save.settings();return render();
    case "showChecklist":S.settings.checklistHidden=false;save.settings();toast("已在首页显示");return render();
    case "water250":{const k=today(),d=await loadDay(k);d.waterMl+=250;saveDay(k);closeSheet();toast("饮水 "+d.waterMl+" ml");return render()}
    case "water":{const k=today(),d=await loadDay(k);d.waterMl=Math.max(0,d.waterMl+ +b.dataset.v);saveDay(k);return render()}
    case "qp":{const k=today(),d=await loadDay(k);d.quickP=Math.max(0,(d.quickP||0)+ +b.dataset.v);saveDay(k);return render()}
    case "delInj":if(confirm("删除这条注射记录？")){S.injections=S.injections.filter(i=>i.id!==b.dataset.id);save.inj();render()}return;
    case "delSx":S.symptoms=S.symptoms.filter(i=>i.id!==b.dataset.id);save.symptoms();return render();
    case "delWeight":S.weights=S.weights.filter(w=>w.id!==b.dataset.id);save.weights();return render();
    case "delMeasure":S.measures=S.measures.filter(w=>w.id!==b.dataset.id);save.measures();return render();
    case "delFood":{const k=S.foodDate;S.days[k].foods=S.days[k].foods.filter(f=>f.id!==b.dataset.id);saveDay(k);return render()}
    case "delEx":{const k=S.foodDate;S.days[k].exercise=S.days[k].exercise.filter(f=>f.id!==b.dataset.id);saveDay(k);return render()}
    case "dayShift":{const d=new Date(S.foodDate+"T12:00");d.setDate(d.getDate()+ +b.dataset.v);if(d.getTime()<=Date.now()+DAY/2){S.foodDate=dkey(d);render()}return}
    case "photo":if(!S.sample||!S.imgOK)return externalAI("meal","meal");$("#photoIn").value="";return $("#photoIn").click();
    case "barcode":return liveScan();
    case "barcodePhoto":stopScan();$("#barcodeIn").value="";return $("#barcodeIn").click();
    case "codeEntry":stopScan();return codeEntry();
    case "paste":return pasteSheet();
    case "import":$("#importIn").value="";return $("#importIn").click();
    case "aiSettings":return aiSheet();
    case "extLabel":return externalAI("label","barcode");
    case "label":$("#labelIn").value="";return $("#labelIn").click();
    case "search":return searchSheet();
    case "manual":return manualSheet();
    case "newCombo":return comboSheet(null);
    case "editCombo":return comboSheet(b.dataset.id);
    case "useCombo":{const c=S.combos.find(x=>x.id===b.dataset.id);if(!c)return;await loadDay(S.foodDate||today());return addFoods(c.items.map(x=>({...x})))}
    case "mealToCombo":{const m=b.dataset.meal,fs=(S.days[S.foodDate]||{foods:[]}).foods.filter(f=>(f.meal||"snack")===m);
      return comboSheet(null,fs.map(({name,g,kcal,p,c,f,fib})=>({name,g,kcal,p,c,f,fib})))}
  }
});
$("#fab").onclick=quickSheet;
$("#photoIn").onchange=e=>{const f=e.target.files[0];if(f)aiPhoto(f)};
$("#barcodeIn").onchange=e=>{const f=e.target.files[0];if(f)scanBarcode(f)};
$("#labelIn").onchange=e=>{const f=e.target.files[0];if(f)readLabel(f)};
$("#extIn").onchange=e=>{const f=e.target.files[0];if(!f)return;S._extFile=f;
  if(typeof S._extTarget==="number"){const st=$("#extSt"+S._extTarget);if(st)st.textContent="已选好照片 ✓ 现在点“复制提示词并分享”"}
  else{const ph=$("#extPh");if(ph)ph.textContent="已选好照片 ✓";const g=$("#extGo");if(g)g.disabled=false}};
$("#importIn").onchange=e=>{const f=e.target.files[0];if(f)importData(f)};
$("#progIn").onchange=e=>{const f=e.target.files[0];if(f)addProgressPhoto(f)};
$("#ciLabelIn").onchange=e=>{const f=e.target.files[0];if(f&&S._ciLabel&&$("#ciList"))S._ciLabel(f)};
setInterval(()=>{if(!isOpen()&&(S.tab==="home"||S.tab==="meds")&&document.visibilityState==="visible")render()},60000);

/* ================= boot ================= */
(async()=>{
  await store.init();
  const keys=["settings","injections","weights","products","recents","measures","symptoms","photos","activity","combos"];
  const [st,inj,w,pr,rc,ms,sx,ph,ac,cb]=await Promise.all(keys.map(k=>store.get(k)));
  S.settings=Object.assign({},DEF,st||{});
  S.injections=(inj&&inj.list)||[];S.weights=(w&&w.list)||[];S.products=(pr&&pr.map)||{};S.recents=(rc&&rc.list)||[];
  S.measures=(ms&&ms.list)||[];S.symptoms=(sx&&sx.list)||[];S.photos=(ph&&ph.list)||[];S.activity=(ac&&ac.dates)||[];S.combos=(cb&&cb.list)||[];
  S.foodDate=today();
  await loadDay(today());
  await render();
  if(!S.settings.onboarded)profileSheet(true);
})();
</script>
